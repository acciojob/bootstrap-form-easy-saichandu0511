<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<h3>Internship Form</h3>
	<form>
		<div>
		<label for=" First Name">First Name</label>
		<input type="text"id="first-name-input">
		</div>
		<div>
		<label for=" Last Name">Last Name</label>
		<input type="text"id="last-name-input">
		</div>
		<div>
		<label for="Email Address">Email Address</label>
		<input type="email"id="email-input" placeholder="xyz@abc.com">
		</div>
		<div>
		<label for="College">College</label>
		<input type="text"id="college-input">
		</div>
		<div>
		<label for="Graduation year">Graduation year</label>
			<br>
		<select>
			<option value="choose..">choose..</option>
			<option value="2020">2020</option>
			<option value="2021">2021</option>
			<option value="2022">2022</option>
			<option value="2023">2023</option>
		</select>
		</div>
		<div>
		<label for="Roll No.">Roll No.</label>
		<input type="number"id="roll-no-input">
		</div>
	    <label>
			<input type="checkbox" id="conditions-checkbox" name="conditions" required>
			Agree to terms and conditions
		</label>
		<br>
		<button>submit form</button>
	</form>
	<!-- the entire body must be written by student -->
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
